<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snack Crackle Pop</title>
<meta name="description" content="Think you know snacks? Two snacks or sodas from around the world, one question: which flavors have they both come in? New puzzles every day.">
<meta name="theme-color" content="#FF6A1A">
<meta property="og:title" content="Snack Crackle Pop">
<meta property="og:description" content="So you think you know snacks? Three rounds, easy to hard, out of 3,000. Beat my score.">
<meta property="og:type" content="website">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/bag.css">
<link rel="stylesheet" href="css/header.css">
<link rel="stylesheet" href="css/tabs.css">
<link rel="stylesheet" href="css/products.css">
<link rel="stylesheet" href="css/guess.css">
<link rel="stylesheet" href="css/board.css">
<link rel="stylesheet" href="css/hints.css">
<link rel="stylesheet" href="css/result.css">
<link rel="stylesheet" href="css/bar.css">
<link rel="stylesheet" href="css/modals.css">
</head>
<body>
<div class="wrap">
  <div class="crimp top"><span class="tear">Tear here · fresh puzzles daily</span></div>
  <header>
    <div class="brand">
      <h1 class="logo"><span class="l1">Snack</span> <span class="l2">Crackle</span> <span class="l3">Pop!</span></h1>
      <div><span class="ribbon">So you think you know snacks?</span></div>
      <div class="meta" id="meta">Daily snack puzzle</div>
    </div>
    <div class="side">
      <div class="burst" aria-hidden="true"><div>3 rounds<small>every day!</small></div></div>
      <div class="hbtns">
        <button class="icon-btn" id="helpBtn" type="button">How to play</button>
        <button class="icon-btn" id="statsBtn" type="button">Stats</button>
        <select class="icon-btn lang" id="langSel" aria-label="Language"><option value="en" lang="en">EN</option><option value="fr" lang="fr">FR</option><option value="es" lang="es">ES</option><option value="zh" lang="zh">中文</option><option value="ja" lang="ja">日本語</option></select>
      </div>
    </div>
  </header>

  <nav class="tabs" id="tabs" role="tablist" aria-label="Game mode">
    <button class="tab" role="tab" type="button" aria-controls="game" id="tab-daily" data-mode="daily">Daily</button>
    <button class="tab" role="tab" type="button" aria-controls="game" id="tab-challenge" data-mode="challenge">Challenge <small>3 items</small></button>
    <button class="tab" role="tab" type="button" aria-controls="game" id="tab-endless" data-mode="endless">Endless</button>
  </nav>
  <div id="game" role="tabpanel" aria-labelledby="tab-daily">
  <div class="roundbar" id="roundbar" hidden></div>

  <div class="window">
  <p class="tagline" id="tagline"></p>
  <section class="matchup" id="matchup" aria-label="Snacks and drinks in this puzzle"></section>
  </div>

  <form class="play" id="form" autocomplete="off">
    <label for="guess" id="guessLabel">Your guess</label>
    <div class="row">
      <input id="guess" type="text" placeholder="Name a flavor: BBQ, Mango, Matcha…" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
      <button class="go" id="goBtn" type="submit">Guess</button>
    </div>
    <ul id="sugg" role="listbox" hidden></ul>
    <div class="msg" id="msg" aria-live="polite"></div>
  </form>

  <section class="progress" id="progress" aria-label="Round progress"></section>

  <section class="board" aria-label="Guesses">
    <div class="bhead" id="bhead"></div>
    <div id="rows"></div>
  </section>

  <section class="hints" aria-label="Hints">
    <div class="hint" id="h1"><b>Hint 1</b>Flavor family</div>
    <div class="hint" id="h2"><b>Hint 2</b>First letter</div>
  </section>

  <section class="result" id="result" hidden></section>

  <div class="practice-bar" id="pbar"></div>
  </div>
  <div class="crimp bottom"><span class="bestby">Best before: midnight</span><span class="barcode" aria-hidden="true"></span></div>
</div>

<div class="scrim" id="helpModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="helpTitle">
    <h2 id="helpTitle">How to play</h2>
    <div id="helpBody"></div>
    <button class="icon-btn close" id="helpClose" type="button" data-close>Let’s play</button>
  </div>
</div>

<div class="scrim" id="statsModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="statsTitle">
    <h2 id="statsTitle">Your stats</h2>
    <div class="stats" id="statsGrid"></div>
    <div class="dist" id="dist"></div>
    <button class="icon-btn close" id="statsClose" type="button" data-close>Close</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<!-- Plain scripts sharing one global scope, loaded in dependency order: data, languages, game logic, screen.
     build_site.py reads this list to bundle the single-file Claude page, so it is the only copy of the order. -->
<script src="js/data/flavors.js"></script>
<script src="js/data/snacks.js"></script>
<script src="js/data/art.js"></script>
<script src="js/i18n/en.js"></script>
<script src="js/i18n/fr.js"></script>
<script src="js/i18n/es.js"></script>
<script src="js/i18n/zh.js"></script>
<script src="js/i18n/ja.js"></script>
<script src="js/i18n/lang.js"></script>
<script src="js/game/util.js"></script>
<script src="js/game/match.js"></script>
<script src="js/game/puzzles.js"></script>
<script src="js/game/state.js"></script>
<script src="js/ui/effects.js"></script>
<script src="js/ui/render.js"></script>
<script src="js/ui/net.js"></script>
<script src="js/ui/input.js"></script>
<script src="js/ui/boot.js"></script>
</body>
</html>
